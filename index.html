<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squat Counter</title>
  <link rel="stylesheet" href="style.css" />
  <!-- TensorFlow.js + Pose Detection + MoveNet (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
  <div id="flash"></div>
  <div id="repBadge">REP!</div>

  <main>
    <h1>🏋️ Squat Counter</h1>

    <div class="top-bar">
      <span id="status">Idle — press Start (or use the simulation slider below without a camera).</span>
      <span id="timer">00:00</span>
    </div>

    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="hud">
      <div class="counter">
        <span id="repCount">0</span>
        <small>REPS</small>
      </div>
      <div class="meter-block">
        <div class="meter"><div id="depthFill"></div></div>
        <small>Depth — knee angle: <span id="angleReadout">—</span></small>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="resetBtn">Reset</button>
      <button id="saveBtn">Save Session</button>
    </div>

    <div class="sim">
      <h3>🧪 Simulation mode (no camera needed)</h3>
      <input type="range" id="simSlider" min="60" max="180" value="170" />
      <span id="simValue">170°</span>
      <p>Drag the slider like a squat: 170° = standing, down to 90° = bottom. A full down-up cycle = 1 rep.</p>
    </div>

    <div class="history">
      <h3>📜 Session history</h3>
      <ul id="historyList"></ul>
      <canvas id="chart" width="400" height="120"></canvas>
    </div>
  </main>

  <script src="squat-counter.js"></script>
  <script src="app.js"></script>
</body>
</html>
